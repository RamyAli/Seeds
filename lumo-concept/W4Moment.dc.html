<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo v4 – Grid moment</title>
<script src="./support.js"></script>
<script src="/_blob/b182923961479cc4ed198465a486c3a2"></script>
<script src="/_blob/2cd7bb501aa419d51c68b2f01f0b7a21"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#1D1D1D}a:hover{color:#5F5C57}
canvas{display:block}
.knob{transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw:focus-visible,.dot:focus-visible,.slide:focus-visible{outline:2px solid #3F628F;outline-offset:2px}
@keyframes lumoNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.nudge{animation:lumoNudge 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.knob{transition:none}.nudge{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #EBE8E3; color: #1D1D1D; font-family: 'Geist', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 8px">
    <header style="display: flex; justify-content: space-between; align-items: center; height: 48px">
      <a href="W4Home.dc.html" aria-label="Back" style="width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <a href="W4Home.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; font-size: 14px; display: flex; align-items: center; text-decoration: none">Not this time</a>
    </header>
    <h1 style="margin: 6px 0 4px; font-size: 26px; font-weight: 400; letter-spacing: -0.01em">Grid Moment</h1>

    <section style="position: relative; height: 214px; border-radius: 26px; background: #F1EFEB; overflow: hidden">
      <canvas ref="{{canvasRef}}" width="190" height="214" role="img" aria-label="{{devAria}}" style="position: absolute; right: 0; top: 0; width: 190px; height: 214px"></canvas>
      <div style="position: absolute; left: 16px; top: 16px; display: flex; flex-direction: column; line-height: 1.3; pointer-events: none">
        <span style="font-size: 17px">Tonight's moment</span>
        <span style="font-size: 12px; color: #5F5C57; display: flex; align-items: center; gap: 4px">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>Grid is busy · {{devName}}</span>
      </div>
      <div style="position: absolute; left: 16px; bottom: 16px; display: flex; gap: 22px; pointer-events: none">
        <span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 11px; color: #5F5C57">From</span><span style="font-size: 15px">5:00 PM</span></span>
        <span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 11px; color: #5F5C57">To</span><span style="font-size: 15px">7:00 PM</span></span>
      </div>
    </section>
    <div role="tablist" aria-label="Device shown" style="display: flex; justify-content: center; gap: 2px; height: 20px; align-items: center">
      <sc-for list="{{dots}}" as="t" hint-placeholder-count="3">
        <button class="dot" role="tab" aria-selected="{{t.on}}" aria-label="{{t.label}}" onClick="{{t.pick}}" style="width: 28px; height: 20px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <span style="width: {{t.w}}px; height: 4px; border-radius: 2px; background: {{t.bg}}"></span>
        </button>
      </sc-for>
    </div>

    <section style="background: #F6F5F2; border-radius: 22px; padding: 12px 12px 12px 16px; display: flex; align-items: center; justify-content: space-between">
      <span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 11px; color: #5F5C57">You'll earn</span><span style="font-size: 15px">+{{points}} points · ≈ AED {{credit}}</span></span>
      <button aria-label="How points work" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #23211F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 11v6M12 7h.01"></path></svg>
      </button>
    </section>

    <section aria-label="What Lumo will change" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{devices}}" as="d" hint-placeholder-count="4">
        <div style="height: 112px; border-radius: 22px; background: {{d.bg}}; padding: 10px 10px 12px 14px; display: flex; flex-direction: column; justify-content: space-between">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="width: 38px; height: 38px; border-radius: 19px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{d.icon}}"></path></svg>
            </span>
            <button class="sw" role="switch" aria-checked="{{d.on}}" aria-label="{{d.aria}}" onClick="{{d.toggle}}" style="width: 56px; height: 44px; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center">
              <span style="width: 56px; height: 30px; border-radius: 15px; background: #FFFFFF; padding: 3px; display: flex; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06)"><span class="knob" style="width: 24px; height: 24px; border-radius: 12px; background: {{d.knobBg}}; transform: {{d.knob}}"></span></span>
            </button>
          </div>
          <span style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 15px">{{d.name}}</span><span style="font-size: 12px; color: #5F5C57">{{d.change}}</span></span>
        </div>
      </sc-for>
    </section>
  </div>

  <a class="slide" href="W4Active.dc.html" aria-label="Accept the grid moment and earn {{points}} points" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; border-radius: 32px; background: #FFFFFF; padding: 0 7px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; box-shadow: 0 10px 24px rgba(0,0,0,.06)">
    <span style="width: 50px; height: 50px; border-radius: 25px; background: #E4F98C; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px rgba(228,249,140,.35)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg>
    </span>
    <span style="display: flex; align-items: center; gap: 10px; font-size: 15px">Slide to accept <span class="nudge" style="color: #8F8A83; letter-spacing: 2px">›››</span></span>
    <span style="width: 50px; height: 50px; border-radius: 25px; background: #EFEDE9; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>
    </span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { ac: true, battery: true, ev: true, pool: false }, dev: 0 };
  }
  componentDidMount() { this.tries = 0; this.mount3d(); }
  componentDidUpdate() {
    if (this.view && this.mountedDev !== this.state.dev) { this.view.dispose(); this.view = null; }
    if (!this.view) this.mount3d();
  }
  componentWillUnmount() { clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    const only = ['battery', 'ac', 'wallbox'][this.state.dev];
    this.mountedDev = this.state.dev;
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'devices', only: only, theme: 'warm', ground: 0xF1EFEB, zoom: only === 'ac' ? 0.7 : 0.85 });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    const list = [
      { id: 'ac', name: 'AC', pts: 60, icon: 'M12 2v20M4.9 7l14.2 10M4.9 17 19.1 7M9 4l3 2 3-2M9 20l3-2 3 2', change: '22°C now · 25°C at 5–7' },
      { id: 'battery', name: 'Battery', pts: 30, icon: 'M4 7h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM22 11v2M6 10v4M10 10v4', change: 'Fill now · run home 5–7' },
      { id: 'ev', name: 'EV charger', pts: 30, icon: 'M5 17h14v-5l-2-5H7l-2 5zM5 12h14M7.5 17v2M16.5 17v2', change: 'Pause till 7 · 80% by 7 am' },
      { id: 'pool', name: 'Pool pump', pts: 20, icon: 'M2 18c2 0 2-1.5 4-1.5S8 18 10 18s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M6 14V4M14 14V4M6 8h8', change: 'Move 5 pm run to 8 pm' }
    ];
    const on = this.state.on;
    let points = 0;
    const devices = list.map((d) => {
      const isOn = !!on[d.id];
      if (isOn) points += d.pts;
      return Object.assign({}, d, {
        on: isOn,
        bg: isOn ? '#F6F5F2' : '#E2DFDA',
        knobBg: isOn ? '#1D1D1D' : '#D6D2CC',
        knob: isOn ? 'translateX(26px)' : 'translateX(0)',
        aria: d.name + ': ' + d.change + '. ' + d.pts + ' points',
        toggle: () => this.setState({ on: Object.assign({}, on, { [d.id]: !isOn }) })
      });
    });
    const names = ['Home battery', 'AC unit', 'EV wallbox'];
    const dots = names.map((n, i) => ({ label: n, on: this.state.dev === i, w: this.state.dev === i ? 16 : 5,
      bg: this.state.dev === i ? '#1D1D1D' : '#B9B4AD', pick: () => this.setState({ dev: i }) }));
    return { canvasRef: this.refFn, devices, points, credit: (points / 20).toFixed(2), dots,
      devName: names[this.state.dev], devAria: '3D product render of your ' + names[this.state.dev] };
  }
}
</script>
</body>
</html>
