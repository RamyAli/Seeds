<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo v4 – Rewards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#1D1D1D}a:hover{color:#5F5C57}
.seg:focus-visible,.wheel:focus-visible,.cta:focus-visible{outline:2px solid #3F628F;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E3E0DB; color: #1D1D1D; font-family: 'Geist', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <header style="display: flex; justify-content: space-between; align-items: center; height: 48px">
      <a href="W4Home.dc.html" aria-label="Back to Home" style="width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
      </a>
      <button aria-label="How points work" style="width: 46px; height: 46px; border-radius: 23px; border: 0; background: #FFFFFF; color: #1D1D1D; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="19" cy="12" r="1.4"></circle></svg>
      </button>
    </header>
    <h1 style="margin: 6px 0 2px; font-size: 26px; font-weight: 400; letter-spacing: -0.01em">Rewards</h1>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: #E4F98C; border-radius: 22px; padding: 14px; display: flex; align-items: center; gap: 10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5"></circle><path d="M8.5 13 7 21l5-2.5 5 2.5-1.5-8"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-size: 26px; font-weight: 300; letter-spacing: -0.02em">2,340</span><span style="font-size: 11px; color: #4A5420">points · AED 117</span></span>
      </div>
      <div style="background: #F6F5F2; border-radius: 22px; padding: 14px; display: flex; align-items: center; gap: 10px">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-size: 26px; font-weight: 300; letter-spacing: -0.02em">4<span style="font-size: 12px; vertical-align: top; margin-left: 2px">in a row</span></span><span style="font-size: 11px; color: #5F5C57">Streak · next Thu 5 PM</span></span>
      </div>
    </section>

    <div aria-label="Badges" style="display: flex; gap: 14px; padding-left: 2px">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 54px"><span style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span><span style="font-size: 11px; color: #5F5C57">First shift</span></span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 54px"><span style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></span><span style="font-size: 11px; color: #5F5C57">Night owl</span></span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 54px"><span style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"></path></svg></span><span style="font-size: 11px; color: #5F5C57">Heatwave</span></span>
      <span style="display: flex; flex-direction: column; align-items: center; gap: 4px; width: 54px"><span style="width: 48px; height: 48px; border-radius: 24px; border: 1.5px dashed #9E988F; display: flex; align-items: center; justify-content: center; color: #5F5C57"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span><span style="font-size: 11px; color: #5F5C57">Guardian</span></span>
    </div>

    <section aria-label="Level 3, 90 percent to level 4" style="background: #F6F5F2; border-radius: 22px; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px">Level 3 · Sun Shifter</span><span style="font-size: 12px; color: #5F5C57">260 pts to Level 4</span></div>
      <svg width="326" height="22" viewBox="0 0 326 22" aria-hidden="true">
        <defs><linearGradient id="lv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F7C4A3"></stop><stop offset="1" stop-color="#E8692A"></stop></linearGradient></defs>
        <path d="{{lvDone}}" stroke="url(#lv)" stroke-width="3" stroke-linecap="round"></path>
        <path d="{{lvRest}}" stroke="#D6D2CC" stroke-width="3" stroke-linecap="round"></path>
      </svg>
    </section>
  </div>

  <section aria-labelledby="redeem-h" style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 392px; border-radius: 38px; background: #F4F2EE; padding: 22px 16px 18px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 -10px 40px rgba(0,0,0,.06)">
    <span id="redeem-h" style="font-size: 13px; color: #5F5C57">Redeem as</span>
    <div role="radiogroup" aria-label="Redeem as" style="display: flex; gap: 8px; margin-top: 10px">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
        <button class="seg" role="radio" aria-checked="{{k.on}}" onClick="{{k.pick}}" style="width: 110px; height: 42px; border-radius: 14px; border: {{k.border}}; background: {{k.bg}}; color: #1D1D1D; font-size: 14px; cursor: pointer">{{k.label}}</button>
      </sc-for>
    </div>
    <div role="radiogroup" aria-label="Amount" style="display: flex; flex-direction: column; align-items: center; margin-top: 10px">
      <sc-for list="{{wheel}}" as="w" hint-placeholder-count="3">
        <button class="wheel" role="radio" aria-checked="{{w.on}}" onClick="{{w.pick}}" style="border: 0; background: transparent; padding: 0 12px; cursor: pointer; font-family: inherit; font-weight: 300; font-size: {{w.size}}px; line-height: 1.18; letter-spacing: -0.03em; color: {{w.color}}; font-variant-numeric: tabular-nums">{{w.text}}</button>
      </sc-for>
    </div>
    <span style="font-size: 13px; color: #5F5C57; margin-top: 4px">{{caption}}</span>
    <button class="cta" style="margin-top: auto; width: 100%; height: 56px; border-radius: 28px; border: 0; background: #23211F; color: #FFFFFF; font-size: 15px; font-weight: 500; cursor: pointer">Redeem {{pts}} points</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 1, kind: 0 }; }
  renderVals() {
    const opts = [{ pts: '500', aed: 25 }, { pts: '1,000', aed: 50 }, { pts: '2,000', aed: 100 }];
    const p = this.state.pick;
    const credit = this.state.kind === 0;
    const wheel = opts.map((o, i) => ({
      text: credit ? 'AED ' + o.aed : o.pts + ' pts', on: i === p,
      size: i === p ? 64 : 30, color: i === p ? '#1D1D1D' : '#8C877F',
      pick: () => this.setState({ pick: i })
    }));
    let lvDone = '', lvRest = '';
    for (let i = 0; i < 54; i++) {
      const x = 2 + i * 6;
      const seg = 'M' + x + ' 3L' + x + ' 19';
      if (i / 53 <= 0.9) lvDone += seg; else lvRest += seg;
    }
    return {
      wheel, lvDone, lvRest, pts: opts[p].pts,
      kinds: ['Bill credit', 'Donate'].map((label, i) => ({ label, on: this.state.kind === i,
        bg: this.state.kind === i ? '#FFFFFF' : 'transparent', border: this.state.kind === i ? '0' : '1px solid #DAD6D0',
        pick: () => this.setState({ kind: i }) })),
      caption: credit ? 'off your July bill · 20 pts = AED 1' : 'AED ' + opts[p].aed + ' to a community solar fund'
    };
  }
}
</script>
</body>
</html>
