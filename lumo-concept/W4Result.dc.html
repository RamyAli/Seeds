<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo v4 – Grid moment complete</title>
<script src="./support.js"></script>
<script src="/_blob/b182923961479cc4ed198465a486c3a2"></script>
<script src="/_blob/6473e9ec8cdb05100ed004f812e4e6de"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#1E1C1A}a:hover{color:#6B665F}
canvas{display:block}
@keyframes lumoRise{0%{transform:translateY(14px);opacity:0}100%{transform:none;opacity:1}}
.rise1{animation:lumoRise .5s .4s ease-out both}
.rise2{animation:lumoRise .5s .55s ease-out both}
@media (prefers-reduced-motion: reduce){.rise1,.rise2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E7E4DF; color: #1E1C1A; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; justify-content: flex-end; height: 48px">
      <a href="W4Home.dc.html" aria-label="Close" style="width: 48px; height: 48px; border-radius: 24px; background: #F6F4F1; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </header>

    <section style="position: relative; height: 384px; border-radius: 34px; background: #F6F4F1; overflow: hidden; display: flex; flex-direction: column; align-items: center">
      <span style="margin-top: 18px; font-size: 14px; color: #4F4A44">Grid moment complete</span>
      <canvas ref="{{canvasRef}}" width="350" height="200" role="img" aria-label="Your Lumo points coin, spinning." style="width: 350px; height: 200px"></canvas>
      <span aria-live="polite" style="font-size: 72px; line-height: 1; font-weight: 300; letter-spacing: -0.05em; font-variant-numeric: tabular-nums">+{{count}}</span>
      <span style="font-size: 15px; margin-top: 4px">points · Nicely done, Omar</span>
      <span style="font-size: 12px; color: #4F4A44; margin-top: 2px">Home stayed at 24°C the whole time.</span>
    </section>

    <section class="rise1" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: #F6F4F1; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-size: 22px; font-weight: 300; letter-spacing: -0.02em">4.80</span><span style="font-size: 11px; color: #4F4A44">AED off your bill</span>
      </div>
      <div style="background: #F6F4F1; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-size: 22px; font-weight: 300; letter-spacing: -0.02em">3.2 kg</span><span style="font-size: 11px; color: #4F4A44">CO₂ · a 16 km drive</span>
      </div>
      <div style="background: #F6F4F1; border-radius: 22px; padding: 12px; display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-size: 22px; font-weight: 300; letter-spacing: -0.02em">16 kWh</span><span style="font-size: 11px; color: #4F4A44">moved off peak</span>
      </div>
    </section>

    <section class="rise2" style="background: #F6F4F1; border-radius: 26px; padding: 14px 16px; display: flex; align-items: center; gap: 14px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 15px; font-weight: 500">4 in a row · Level 3 Sun Shifter</span>
        <div role="img" aria-label="Streak: 4 of 5 moments done" style="display: flex; gap: 6px">
          <span style="width: 22px; height: 22px; border-radius: 11px; background: #1E1C1A"></span><span style="width: 22px; height: 22px; border-radius: 11px; background: #1E1C1A"></span><span style="width: 22px; height: 22px; border-radius: 11px; background: #1E1C1A"></span><span style="width: 22px; height: 22px; border-radius: 11px; background: #1E1C1A"></span><span style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px dashed #8B857D"></span>
        </div>
        <span style="font-size: 12px; color: #4F4A44">One more unlocks 1.5× points for a week</span>
      </div>
      <span style="height: 32px; padding: 0 12px; border-radius: 16px; background: #DDF57A; font-size: 12px; font-weight: 600; display: flex; align-items: center">2,340 pts</span>
    </section>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 8px">
    <a href="W4Home.dc.html" style="height: 58px; border-radius: 29px; background: #F6F4F1; font-size: 15px; display: flex; align-items: center; justify-content: center; text-decoration: none">Home</a>
    <a href="W4Wallet.dc.html" style="height: 58px; border-radius: 29px; background: #1E1C1A; color: #FFFFFF; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; text-decoration: none">Open wallet</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { count: 0 }; }
  componentDidMount() {
    this.tries = 0; this.mount3d();
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ count: 120 }); return; }
    const start = Date.now() + 300, dur = 1200;
    this.timer = setInterval(() => {
      const t = Math.min(1, Math.max(0, (Date.now() - start) / dur));
      this.setState({ count: Math.round(120 * (1 - Math.pow(1 - t, 3))) });
      if (t >= 1) clearInterval(this.timer);
    }, 30);
  }
  componentDidUpdate() { if (!this.view) this.mount3d(); }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'coin', theme: 'warm', zoom: 1.05 });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    return { canvasRef: this.refFn, count: this.state.count };
  }
}
</script>
</body>
</html>
