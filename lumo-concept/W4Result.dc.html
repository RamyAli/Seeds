<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo v4 – Grid moment complete</title>
<script src="./support.js"></script>
<script src="/_blob/b182923961479cc4ed198465a486c3a2"></script>
<script src="/_blob/2cd7bb501aa419d51c68b2f01f0b7a21"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#1D1D1D}a:hover{color:#5F5C57}
canvas{display:block}
@keyframes lumoUp{0%{transform:translateY(24px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
.up{animation:lumoUp .6s cubic-bezier(.2,.9,.3,1.1) both}
@media (prefers-reduced-motion: reduce){.up{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #CFCDC9; color: #1D1D1D; font-family: 'Geist', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <canvas ref="{{bgRef}}" width="390" height="844" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; filter: blur(14px) saturate(90%); transform: scale(1.08)"></canvas>
  <div style="position: absolute; inset: 0; background: rgba(232,230,226,.35)"></div>

  <a href="W4Home.dc.html" aria-label="Close" style="position: absolute; right: 16px; top: 52px; width: 46px; height: 46px; border-radius: 23px; background: rgba(255,255,255,.85); display: flex; align-items: center; justify-content: center">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
  </a>

  <section class="up" style="position: absolute; left: 16px; right: 16px; top: 140px; height: 446px; border-radius: 36px; background: linear-gradient(180deg, #FFFFFF 0%, #F3F1ED 100%); display: flex; flex-direction: column; align-items: center; padding: 22px 18px 18px; box-shadow: 0 20px 50px rgba(0,0,0,.08)">
    <span style="font-size: 14px; color: #5F5C57">Grid moment complete</span>
    <canvas ref="{{coinRef}}" width="320" height="220" role="img" aria-label="Your Lumo points coin, spinning." style="width: 320px; height: 220px; margin-top: 4px"></canvas>
    <span aria-live="polite" style="font-size: 30px; font-weight: 400; letter-spacing: -0.01em; font-variant-numeric: tabular-nums">+{{count}} points</span>
    <span style="font-size: 12px; color: #5F5C57; margin-top: 2px">Nicely done, Omar · home stayed at 24°C</span>
    <div style="margin-top: auto; align-self: stretch; height: 64px; border-radius: 32px; background: #F6F5F2; box-shadow: inset 0 0 0 1px #ECE9E4; padding: 0 7px; display: flex; align-items: center; gap: 10px">
      <span style="width: 50px; height: 50px; flex: none; border-radius: 25px; background: #E4F98C; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 6px rgba(228,249,140,.35)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>
      </span>
      <span style="flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; line-height: 1.2">
        <span style="display: flex; flex-direction: column"><span style="font-size: 15px">4.80</span><span style="font-size: 11px; color: #5F5C57">AED off</span></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 15px">3.2 kg</span><span style="font-size: 11px; color: #5F5C57">CO₂ avoided</span></span>
        <span style="display: flex; flex-direction: column"><span style="font-size: 15px">4 in a row</span><span style="font-size: 11px; color: #5F5C57">streak</span></span>
      </span>
    </div>
  </section>

  <a href="W4Wallet.dc.html" class="up" style="position: absolute; left: 16px; right: 16px; top: 596px; height: 60px; border-radius: 30px; background: rgba(255,255,255,.88); display: flex; align-items: center; justify-content: center; font-size: 15px; text-decoration: none; animation-delay: .12s">Open wallet</a>
  <a href="W4Home.dc.html" style="position: absolute; left: 16px; right: 16px; top: 664px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #3A3835; text-decoration: none">Back to home</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { count: 0 }; }
  componentDidMount() {
    this.tries = 0; this.mount3d();
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { this.setState({ count: 120 }); return; }
    const start = Date.now() + 300, dur = 1200;
    this.timer = setInterval(() => {
      const t = Math.min(1, Math.max(0, (Date.now() - start) / dur));
      this.setState({ count: Math.round(120 * (1 - Math.pow(1 - t, 3))) });
      if (t >= 1) clearInterval(this.timer);
    }, 30);
  }
  componentDidUpdate() { if (!this.views) this.mount3d(); }
  componentWillUnmount() { clearInterval(this.timer); clearTimeout(this.retry); (this.views || []).forEach((v) => v && v.dispose()); }
  mount3d() {
    if (this.views || !this.bg || !this.coin) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.views = [
      window.Lumo3D.mount(this.bg, { scene: 'home', arch: true, theme: 'warm', shift: [0.06, -0.19], zoom: 0.6, still: true }),
      window.Lumo3D.mount(this.coin, { scene: 'coin', theme: 'warm', zoom: 1.0 })
    ];
  }
  renderVals() {
    if (!this.refs3d) this.refs3d = { bg: (el) => { if (el) this.bg = el; }, coin: (el) => { if (el) this.coin = el; } };
    return { bgRef: this.refs3d.bg, coinRef: this.refs3d.coin, count: this.state.count };
  }
}
</script>
</body>
</html>
