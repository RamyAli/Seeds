<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo – Rewards wallet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#1D1D1F}a:hover{color:#3A3A3C}
.glass{background:rgba(255,255,255,.56);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 32px rgba(31,41,66,.08),inset 0 1px 0 rgba(255,255,255,.95)}
.glass-hi{background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(31,41,66,.10),inset 0 1px 0 #FFFFFF}
.blob{position:absolute;border-radius:50%;filter:blur(56px);pointer-events:none}
.chip{transition:background .15s ease,color .15s ease}
.chip:focus-visible,.cta:focus-visible{outline:2px solid #0062CC;outline-offset:2px}
@keyframes lumoRing{from{stroke-dashoffset:201}}
.lvl{animation:lumoRing 1.2s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.lvl{animation:none}.chip{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F1F2F5; color: #1D1D1F; font-family: 'Figtree', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div class="blob" style="width: 360px; height: 360px; right: -140px; top: -120px; background: #FFBE6B; opacity: 0.8"></div>
  <div class="blob" style="width: 300px; height: 300px; left: -150px; top: 360px; background: #C7B8FF; opacity: 0.55"></div>
  <div class="blob" style="width: 260px; height: 260px; right: -100px; bottom: 0; background: #B6EBC4; opacity: 0.65"></div>

  <div style="position: relative; padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; justify-content: space-between; height: 44px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.03em">Rewards</h1>
      <button class="glass-hi" style="height: 44px; padding: 0 14px; border-radius: 22px; color: #1D1D1F; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>How it works</button>
    </header>

    <section style="position: relative; overflow: hidden; background: #1D1D1F; color: #F5F5F7; border-radius: 30px; padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 18px 40px rgba(29,29,31,.25)">
      <div class="blob" style="width: 220px; height: 220px; left: -60px; top: -100px; background: #FF9500; opacity: 0.55; filter: blur(50px)"></div>
      <div class="blob" style="width: 180px; height: 180px; right: -60px; bottom: -90px; background: #0A84FF; opacity: 0.45; filter: blur(50px)"></div>
      <div style="position: relative; display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 13px; color: #D1D1D6">Your points</span>
          <span style="font-size: 52px; line-height: 1.05; font-weight: 800; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">2,340</span>
          <span style="font-size: 13px; color: #FFB340; font-weight: 600">Worth AED 117.00 in bill credit</span>
        </div>
        <div role="img" aria-label="Level 3, 90 percent to level 4" style="position: relative; width: 78px; height: 78px; border-radius: 39px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16)">
          <svg width="76" height="76" viewBox="0 0 76 76" style="transform: rotate(-90deg)" aria-hidden="true">
            <circle cx="38" cy="38" r="32" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"></circle>
            <circle class="lvl" cx="38" cy="38" r="32" fill="none" stroke="#FFB340" stroke-width="7" stroke-linecap="round" stroke-dasharray="201" stroke-dashoffset="20"></circle>
          </svg>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1">
            <span style="font-size: 10px; color: #D1D1D6">Level</span>
            <span style="font-size: 22px; font-weight: 800">3</span>
          </div>
        </div>
      </div>
      <div style="position: relative; display: flex; justify-content: space-between; font-size: 12px; color: #D1D1D6; border-top: 1px solid rgba(255,255,255,.12); padding-top: 10px">
        <span><b style="color: #F5F5F7">Sun Shifter</b> · 260 pts to Grid Guardian</span>
        <span>20 pts = AED 1</span>
      </div>
    </section>

    <section class="glass" aria-labelledby="redeem-h" style="border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="redeem-h" style="margin: 0; font-size: 16px; font-weight: 700">Turn points into bill credit</h2>
      <div role="radiogroup" aria-label="Amount to redeem" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button class="chip" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 58px; border-radius: 18px; border: {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; box-shadow: {{o.shadow}}">
            <span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">AED {{o.aed}}</span>
            <span style="font-size: 11px; opacity: 0.85">{{o.pts}} pts</span>
          </button>
        </sc-for>
      </div>
      <button class="cta" style="height: 52px; border-radius: 26px; border: 0; background: #FF9F0A; color: #1D1D1F; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(255,149,0,.28), inset 0 1px 0 rgba(255,255,255,.5)">Take AED {{aed}} off my July bill</button>
    </section>

    <section class="glass" style="border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B25000" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"></path></svg>4-moment streak</span>
        <span style="font-size: 12px; color: #3A3A3C">Next: Thu 5 pm</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 11px; color: #3A3A3C">
        <sc-for list="{{week}}" as="w" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
            <span aria-label="{{w.aria}}" style="width: 36px; height: 36px; border-radius: 18px; background: {{w.bg}}; border: {{w.border}}; color: #1D1D1F; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{w.done}}" hint-placeholder-val="{{ true }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>
              </sc-if>
            </span>
            <span>{{w.d}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 4px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700">Badges</h2>
        <span style="font-size: 12px; color: #3A3A3C">3 of 12</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div class="glass" style="border-radius: 22px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
          <span style="width: 46px; height: 46px; border-radius: 23px; background: #FF9F0A; color: #1D1D1F; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
          <span style="font-size: 11px; line-height: 1.2; font-weight: 600">First shift</span>
        </div>
        <div class="glass" style="border-radius: 22px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
          <span style="width: 46px; height: 46px; border-radius: 23px; background: #0A84FF; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.4)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></span>
          <span style="font-size: 11px; line-height: 1.2; font-weight: 600">Night owl</span>
        </div>
        <div class="glass" style="border-radius: 22px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
          <span style="width: 46px; height: 46px; border-radius: 23px; background: #34C759; color: #1D1D1F; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.5)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"></path></svg></span>
          <span style="font-size: 11px; line-height: 1.2; font-weight: 600">Heatwave hero</span>
        </div>
        <div style="border: 1.5px dashed rgba(60,60,67,.3); border-radius: 22px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
          <span style="width: 46px; height: 46px; border-radius: 23px; background: rgba(120,120,128,.14); color: #3A3A3C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
          <span style="font-size: 11px; line-height: 1.2; color: #3A3A3C">Grid Guardian · L4</span>
        </div>
      </div>
    </section>
  </div>

  <nav class="glass-hi" aria-label="Main" style="position: absolute; left: 16px; right: 16px; bottom: 24px; height: 64px; border-radius: 32px; padding: 6px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px">
    <a href="Main.dc.html" style="border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #3A3A3C; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="SolarDetail.dc.html" style="border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #3A3A3C; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15v3M12 10v8M17 6v12"></path></svg>Usage</a>
    <a href="Wallet.dc.html" aria-current="page" style="border-radius: 26px; background: rgba(255,149,0,.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #B25000; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>Rewards</a>
    <a href="Main.dc.html" style="border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #3A3A3C; text-decoration: none; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Account</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 1 };
  }
  renderVals() {
    const opts = [{ pts: '500', aed: 25 }, { pts: '1,000', aed: 50 }, { pts: '2,000', aed: 100 }];
    const options = opts.map((o, i) => {
      const on = this.state.pick === i;
      return Object.assign({}, o, {
        on,
        bg: on ? '#1D1D1F' : 'rgba(255,255,255,.8)',
        fg: on ? '#FFFFFF' : '#1D1D1F',
        border: on ? '1px solid #1D1D1F' : '1px solid rgba(255,255,255,.95)',
        shadow: on ? '0 8px 18px rgba(29,29,31,.25)' : '0 4px 12px rgba(31,41,66,.06)',
        pick: () => this.setState({ pick: i })
      });
    });
    const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const done = [true, true, true, false, false, false, false];
    const week = days.map((d, i) => ({
      d,
      done: done[i],
      bg: done[i] ? '#FF9F0A' : (i === 3 ? 'rgba(255,255,255,.9)' : 'rgba(120,120,128,.12)'),
      border: i === 3 && !done[i] ? '1.5px dashed #B25000' : '0',
      aria: d + ': ' + (done[i] ? 'moment completed' : (i === 3 ? 'next moment' : 'no moment'))
    }));
    return { options, aed: opts[this.state.pick].aed, week };
  }
}
</script>
</body>
</html>
