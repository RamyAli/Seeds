<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo – Rewards wallet</title>
<script src="./support.js"></script>
<script src="/_blob/b182923961479cc4ed198465a486c3a2"></script>
<script src="/_blob/089d29c6ab9b713f088013abcd18ba13"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#111315}a:hover{color:#5E6369}
canvas{display:block}
.chip{transition:background .15s ease}
.chip:focus-visible,.cta:focus-visible{outline:2px solid #1D5FD1;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.chip{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F3F5; color: #111315; font-family: 'Manrope', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; gap: 8px; height: 52px">
      <div style="flex: 1; height: 52px; border-radius: 26px; background: #A6F23C; padding: 0 8px 0 18px; display: flex; align-items: center; justify-content: space-between">
        <div style="display: flex; flex-direction: column; line-height: 1.2">
          <span style="font-size: 16px; font-weight: 800">Rewards</span>
          <span style="font-size: 11px; font-weight: 600; color: #2A3A10">Level 3 · Sun Shifter</span>
        </div>
        <button aria-label="How points work" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: #111315; color: #A6F23C; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </button>
      </div>
    </header>

    <section style="position: relative; background: #FFFFFF; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
      <canvas ref="{{canvasRef}}" width="150" height="150" role="img" aria-label="Your Lumo points coin." style="position: absolute; right: -6px; top: -8px; width: 150px; height: 150px"></canvas>
      <span style="font-size: 12px; color: #5E6369; font-weight: 700">Your points</span>
      <span style="font-size: 54px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums">2,340</span>
      <span style="align-self: flex-start; height: 28px; padding: 0 10px; border-radius: 14px; background: #E9FBD0; color: #3E7C00; font-size: 12px; font-weight: 800; display: flex; align-items: center">= AED 117.00 bill credit</span>
      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
        <div role="img" aria-label="Level progress 90 percent" style="height: 10px; border-radius: 5px; background: repeating-linear-gradient(135deg, #D5D8DC 0 2px, #F2F3F5 2px 6px); overflow: hidden">
          <div style="width: 90%; height: 10px; border-radius: 5px; background: #111315"></div>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #5E6369; font-weight: 600"><span>260 pts to Grid Guardian</span><span>20 pts = AED 1</span></div>
      </div>
    </section>

    <section aria-labelledby="redeem-h" style="background: #FFFFFF; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 id="redeem-h" style="margin: 0; font-size: 16px; font-weight: 800">Turn points into bill credit</h2>
      <div role="radiogroup" aria-label="Amount to redeem" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
          <button class="chip" role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 58px; border-radius: 20px; border: {{o.border}}; background: {{o.bg}}; color: #111315; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2">
            <span style="font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">AED {{o.aed}}</span>
            <span style="font-size: 11px; font-weight: 600; color: #3A3E44">{{o.pts}} pts</span>
          </button>
        </sc-for>
      </div>
      <button class="cta" style="height: 54px; border-radius: 27px; border: 0; background: #111315; color: #FFFFFF; font-size: 15px; font-weight: 800; cursor: pointer">Take AED {{aed}} off my July bill</button>
    </section>

    <section style="background: #FFFFFF; border-radius: 28px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: center">
        <span style="font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"></path></svg>4-moment streak</span>
        <span style="font-size: 12px; color: #5E6369; font-weight: 600">Next: Thu 5 pm</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center; font-size: 11px; color: #5E6369; font-weight: 700">
        <sc-for list="{{week}}" as="w" hint-placeholder-count="7">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
            <span aria-label="{{w.aria}}" style="width: 36px; height: 36px; border-radius: 18px; background: {{w.bg}}; border: {{w.border}}; color: #111315; display: flex; align-items: center; justify-content: center">
              <sc-if value="{{w.done}}" hint-placeholder-val="{{ true }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>
              </sc-if>
            </span>
            <span>{{w.d}}</span>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
        <span style="width: 42px; height: 42px; border-radius: 21px; background: #A6F23C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"></path></svg></span>
        <span style="font-size: 11px; line-height: 1.2; font-weight: 700">First shift</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
        <span style="width: 42px; height: 42px; border-radius: 21px; background: #111315; color: #A6F23C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></span>
        <span style="font-size: 11px; line-height: 1.2; font-weight: 700">Night owl</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 20px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
        <span style="width: 42px; height: 42px; border-radius: 21px; background: #A9C9FF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 0 0-4 0v10.8a4 4 0 1 0 4 0z"></path></svg></span>
        <span style="font-size: 11px; line-height: 1.2; font-weight: 700">Heatwave hero</span>
      </div>
      <div style="border: 1.5px dashed #B9BEC4; border-radius: 20px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
        <span style="width: 42px; height: 42px; border-radius: 21px; background: #E6E8EB; color: #5E6369; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
        <span style="font-size: 11px; line-height: 1.2; color: #5E6369; font-weight: 700">Guardian · L4</span>
      </div>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 22px; height: 68px; border-radius: 34px; padding: 8px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(17,19,21,.10); display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="Home" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg></a>
    <a href="SolarDetail.dc.html" aria-label="Usage" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15v3M12 10v8M17 6v12"></path></svg></a>
    <a href="Wallet.dc.html" aria-current="page" style="height: 52px; padding: 0 18px 0 14px; border-radius: 26px; background: #A6F23C; color: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 800">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>Rewards</a>
    <a href="Main.dc.html" aria-label="Account" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 1 };
  }
  componentDidMount() { this.tries = 0; this.mount3d(); }
  componentDidUpdate() { if (!this.view) this.mount3d(); }
  componentWillUnmount() { clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'coin', zoom: 0.95 });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    const opts = [{ pts: '500', aed: 25 }, { pts: '1,000', aed: 50 }, { pts: '2,000', aed: 100 }];
    const options = opts.map((o, i) => {
      const on = this.state.pick === i;
      return Object.assign({}, o, {
        on,
        bg: on ? '#A6F23C' : '#F4F5F6',
        border: on ? '2px solid #111315' : '2px solid transparent',
        pick: () => this.setState({ pick: i })
      });
    });
    const days = ['M', 'T', 'W', 'T', 'F', 'S', 'S'];
    const done = [true, true, true, false, false, false, false];
    const week = days.map((d, i) => ({
      d, done: done[i],
      bg: done[i] ? '#A6F23C' : (i === 3 ? '#FFFFFF' : 'repeating-linear-gradient(135deg, #D5D8DC 0 2px, #F2F3F5 2px 6px)'),
      border: i === 3 && !done[i] ? '1.5px dashed #111315' : '0',
      aria: d + ': ' + (done[i] ? 'moment completed' : (i === 3 ? 'next moment' : 'no moment'))
    }));
    return { canvasRef: this.refFn, options, aed: opts[this.state.pick].aed, week };
  }
}
</script>
</body>
</html>
