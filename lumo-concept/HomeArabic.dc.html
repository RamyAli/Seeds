<div dir="rtl" lang="ar" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F3F5; color: #111315; font-family: 'Readex Pro', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; gap: 10px; height: 44px">
      <div style="display: flex; flex-direction: column; flex: 1; line-height: 1.3">

        <span style="font-size: 21px; font-weight: 700">مرحبًا يا عمر</span>
      </div>
      <button aria-label="الإشعارات، إشعار جديد" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #111315; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
        <span style="position: absolute; top: 10px; inset-inline-end: 11px; width: 9px; height: 9px; border-radius: 5px; background: #8FD920; box-shadow: 0 0 0 2px #FFFFFF"></span>
      </button>
      <span aria-label="الملف الشخصي" style="width: 44px; height: 44px; border-radius: 22px; background: #111315; color: #A6F23C; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">ع</span>
    </header>

    <section aria-label="الطاقة مباشرة" style="position: relative; height: 312px; border-radius: 28px; background: #FFFFFF; overflow: hidden">
      <canvas ref="{{canvasRef}}" width="350" height="312" role="img" aria-label="مجسّم ثلاثي الأبعاد لفيلتك: الألواح الشمسية ترسل 5.4 كيلوواط إلى المنزل، و2.1 كيلوواط تشحن البطارية، و0.7 كيلوواط من الشبكة، والسيارة متوقفة." style="position: absolute; left: 0; top: 0; width: 350px; height: 312px; touch-action: pan-y; cursor: grab"></canvas>
      <div style="position: absolute; inset-inline-start: 18px; top: 16px; display: flex; flex-direction: column; pointer-events: none">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600">
          <span class="pulse" style="width: 8px; height: 8px; border-radius: 4px; background: #8FD920"></span>مباشر · الآن</span>
        <span class="num" dir="ltr" style="font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; text-align: right; margin-top: 4px">82<span style="font-size: 30px; letter-spacing: -0.02em">%</span></span>
        <span style="font-size: 13px; font-weight: 500; color: #5E6369">بطاقة الشمس</span>
      </div>
      <span style="position: absolute; inset-inline-end: 14px; top: 16px; height: 28px; padding: 0 10px; border-radius: 14px; background: #F2F3F5; font-size: 11px; font-weight: 600; color: #5E6369; display: flex; align-items: center; pointer-events: none">اسحب للتدوير</span>
      <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <button aria-label="الشمس 5.4 كيلوواط" style="background: rgba(255,255,255,0.9); border: 1px solid #EEF0F2; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; color: #111315; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #FFA51F"></span>
          <b class="num" style="font-size: 15px">5.4</b>
          <span style="font-size: 10px; color: #5E6369">الشمس ك.و</span>
        </button>
        <button aria-label="البطارية تشحن 2.1 كيلوواط" style="background: rgba(255,255,255,0.9); border: 1px solid #EEF0F2; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; color: #111315; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #8FD920"></span>
          <b class="num" dir="ltr" style="font-size: 15px">+2.1</b>
          <span style="font-size: 10px; color: #5E6369">البطارية ك.و</span>
        </button>
        <button aria-label="الشبكة 0.7 كيلوواط" style="background: rgba(255,255,255,0.9); border: 1px solid #EEF0F2; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; color: #111315; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #3D8BFF"></span>
          <b class="num" style="font-size: 15px">0.7</b>
          <span style="font-size: 10px; color: #5E6369">الشبكة ك.و</span>
        </button>
        <button aria-label="شاحن السيارة متوقف، يبدأ 11 مساءً" style="background: rgba(255,255,255,0.9); border: 1px dashed #B9BEC4; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; color: #111315; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #B9BEC4"></span>
          <b style="font-size: 14px">متوقفة</b>
          <span style="font-size: 10px; color: #5E6369">السيارة · 11 م</span>
        </button>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #FFFFFF; border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #5E6369">تكلفة اليوم حتى الآن</span>
        <span style="font-size: 24px; font-weight: 700"><span class="num" style="font-weight: 800; letter-spacing: -0.03em">12.60</span> <span style="font-size: 12px; color: #5E6369">د.إ</span></span>
        <span style="align-self: flex-start; font-size: 11px; font-weight: 600; background: #E9FBD0; color: #3E7C00; padding: 2px 8px; border-radius: 10px">وفّرت الشمس 5.70 د.إ</span>
      </div>
      <div style="background: #FFFFFF; border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #5E6369">البطارية <span style="color: #3E7C00; font-weight: 700">تشحن</span></span>
        <span class="num" dir="ltr" style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; text-align: right">64%</span>
        <div role="img" aria-label="البطارية 64٪، تمتلئ بحلول 1 ظهرًا" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; height: 14px">
          <span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #CDEFA0"></span><span style="border-radius: 3px; background: #E6E8EB"></span><span style="border-radius: 3px; background: #E6E8EB"></span><span style="border-radius: 3px; background: #E6E8EB"></span>
        </div>
        <span style="font-size: 11px; color: #5E6369">تمتلئ بحلول 1:00 م</span>
      </div>
    </section>

    <section aria-label="نصيحة" style="background: #C6F36A; border-radius: 26px; padding-block: 14px; padding-inline: 16px 14px; display: flex; gap: 12px; align-items: center">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="3"></rect><circle cx="12" cy="13" r="5"></circle><path d="M8 6h.01M11 6h2"></path></svg>
      </span>
      <p style="margin: 0; font-size: 14px; line-height: 1.6; font-weight: 500; flex: 1">تمتلئ البطارية بحلول <b>1 ظهرًا</b> — وقت مثالي لتشغيل الغسالة.</p>
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #111315; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer; flex: none">ذكّرني</button>
    </section>
  </div>

  <nav aria-label="القائمة الرئيسية" style="position: absolute; left: 24px; right: 24px; bottom: 22px; height: 68px; border-radius: 34px; padding: 8px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(17,19,21,.10); display: flex; align-items: center; justify-content: space-between">
    <a href="HomeArabic.dc.html" aria-current="page" style="height: 52px; padding-inline: 14px 18px; border-radius: 26px; background: #A6F23C; color: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>الرئيسية</a>
    <a href="HomeArabic.dc.html" aria-label="الاستهلاك" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true" style="transform: scaleX(-1)"><path d="M3 3v18h18"></path><path d="M7 15v3M12 10v8M17 6v12"></path></svg></a>
    <a href="GridMomentArabic.dc.html" aria-label="المكافآت" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></a>
    <a href="HomeArabic.dc.html" aria-label="الحساب" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true,"section":"Motion"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.tries = 0; this.mount3d(); }
  componentDidUpdate() { if (!this.view) this.mount3d(); }
  componentWillUnmount() { clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'home', theme: 'day', mirror: true, shift: [0.08, 0.04], zoom: 0.84, still: this.props.motion === false });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    return { canvasRef: this.refFn };
  }
}
</script>
