<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo Home – Night</title>
<script src="./support.js"></script>
<script src="/_blob/b182923961479cc4ed198465a486c3a2"></script>
<script src="/_blob/089d29c6ab9b713f088013abcd18ba13"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#F3F4F5}a:hover{color:#A6F23C}
canvas{display:block}
@keyframes lumoPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.pulse{animation:lumoPulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E0F11; color: #F3F4F5; font-family: 'Manrope', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; gap: 10px; height: 44px">
      <div style="display: flex; flex-direction: column; flex: 1; line-height: 1.2">
        <span style="font-size: 13px; color: #9BA1A8; font-weight: 500">Wednesday · 11:40 pm</span>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Good night, Omar</span>
      </div>
      <button aria-label="Notifications" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #1A1C1F; color: #F3F4F5; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      </button>
      <span aria-label="Omar's profile" style="width: 44px; height: 44px; border-radius: 22px; background: #A6F23C; color: #111315; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">O</span>
    </header>

    <section aria-label="Live energy" style="position: relative; height: 312px; border-radius: 28px; background: #1A1C1F; overflow: hidden">
      <canvas ref="{{canvasRef}}" width="350" height="312" role="img" aria-label="3D view of your villa at night. The battery sends 1.8 kW into the house, the grid supplies 8.2 kW at the night rate, and the car is charging at 7.4 kW." style="position: absolute; left: 0; top: 0; width: 350px; height: 312px; touch-action: pan-y; cursor: grab"></canvas>
      <div style="position: absolute; left: 18px; top: 16px; display: flex; flex-direction: column; pointer-events: none">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700">
          <span class="pulse" style="width: 8px; height: 8px; border-radius: 4px; background: #A6F23C"></span>Live · right now</span>
        <span style="font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; margin-top: 4px">70<span style="font-size: 30px; letter-spacing: -0.02em">%</span></span>
        <span style="font-size: 13px; font-weight: 600; color: #9BA1A8">running on your battery</span>
      </div>
      <span style="position: absolute; right: 14px; top: 16px; height: 28px; padding: 0 10px; border-radius: 14px; background: #24272B; font-size: 11px; font-weight: 700; color: #C9CDD2; display: flex; align-items: center; gap: 5px; pointer-events: none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>Night rate</span>
      <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <a href="SolarDetail.dc.html" aria-label="Solar resting, back at 5:35 am" style="background: rgba(26,28,31,0.88); backdrop-filter: blur(10px); border: 1px dashed #4A4F55; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #4A4F55"></span>
          <b style="font-size: 15px">5:35</b>
          <span style="font-size: 10px; color: #9BA1A8; font-weight: 600">Solar back</span>
        </a>
        <button aria-label="Battery powering the home at 1.8 kW" style="background: rgba(26,28,31,0.88); backdrop-filter: blur(10px); border: 1px solid #2A2D31; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; color: #F3F4F5; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #8FD920"></span>
          <b style="font-size: 15px; font-variant-numeric: tabular-nums">−1.8</b>
          <span style="font-size: 10px; color: #9BA1A8; font-weight: 600">Battery kW</span>
        </button>
        <button aria-label="Grid supplying 8.2 kW at the night rate" style="background: rgba(26,28,31,0.88); backdrop-filter: blur(10px); border: 1px solid #2A2D31; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; color: #F3F4F5; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #3D8BFF"></span>
          <b style="font-size: 15px; font-variant-numeric: tabular-nums">8.2</b>
          <span style="font-size: 10px; color: #9BA1A8; font-weight: 600">Grid kW</span>
        </button>
        <button aria-label="EV charging at 7.4 kW, 42% now" style="background: rgba(26,28,31,0.88); backdrop-filter: blur(10px); border: 1px solid #2A2D31; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; color: #F3F4F5; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #F3F4F5"></span>
          <b style="font-size: 15px; font-variant-numeric: tabular-nums">7.4</b>
          <span style="font-size: 10px; color: #9BA1A8; font-weight: 600">EV kW</span>
        </button>
      </div>
    </section>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #1A1C1F; border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 12px; color: #9BA1A8; font-weight: 600">Today's cost</span>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">18.40<span style="font-size: 12px; font-weight: 700; color: #9BA1A8; letter-spacing: 0"> AED</span></span>
        <span style="align-self: flex-start; font-size: 11px; font-weight: 700; background: #1E2A3F; color: #8DB8FF; padding: 3px 8px; border-radius: 10px">Night rate till 6 am</span>
      </div>
      <div style="background: #1A1C1F; border-radius: 24px; padding: 14px; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #9BA1A8; font-weight: 600">Battery
          <span style="color: #A6F23C; font-weight: 700">In use</span></span>
        <span style="font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; font-variant-numeric: tabular-nums">46%</span>
        <div role="img" aria-label="Battery 46 percent, about 3 hours 10 minutes left" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; height: 14px">
          <span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #8FD920"></span><span style="border-radius: 3px; background: #5C8A1C"></span><span style="border-radius: 3px; background: #2A2D31"></span><span style="border-radius: 3px; background: #2A2D31"></span><span style="border-radius: 3px; background: #2A2D31"></span><span style="border-radius: 3px; background: #2A2D31"></span><span style="border-radius: 3px; background: #2A2D31"></span>
        </div>
        <span style="font-size: 11px; color: #9BA1A8; font-weight: 600">About 3 h 10 m left</span>
      </div>
    </section>

    <section aria-label="Insight" style="background: #1A1C1F; border: 1px solid #2A2D31; border-radius: 26px; padding: 14px 14px 14px 16px; display: flex; gap: 12px; align-items: center">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #A6F23C; color: #111315; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 17h14v-5l-2-5H7l-2 5z"></path><circle cx="7.5" cy="17.5" r="1.5"></circle><circle cx="16.5" cy="17.5" r="1.5"></circle></svg>
      </span>
      <p style="margin: 0; font-size: 14px; line-height: 1.4; font-weight: 600; flex: 1">Car's charging at the night rate. You'll wake up to <b style="font-weight: 800; color: #A6F23C">80%</b>.</p>
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #F3F4F5; color: #111315; font-size: 13px; font-weight: 700; cursor: pointer; flex: none">Edit</button>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 22px; height: 68px; border-radius: 34px; padding: 8px; background: #1A1C1F; border: 1px solid #2A2D31; box-shadow: 0 10px 30px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: space-between">
    <a href="HomeNight.dc.html" aria-current="page" style="height: 52px; padding: 0 18px 0 14px; border-radius: 26px; background: #A6F23C; color: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 800">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="SolarDetail.dc.html" aria-label="Usage" style="width: 52px; height: 52px; border-radius: 26px; background: #24272B; color: #F3F4F5; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15v3M12 10v8M17 6v12"></path></svg></a>
    <a href="Wallet.dc.html" aria-label="Rewards" style="width: 52px; height: 52px; border-radius: 26px; background: #24272B; color: #F3F4F5; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></a>
    <a href="HomeNight.dc.html" aria-label="Account" style="width: 52px; height: 52px; border-radius: 26px; background: #24272B; color: #F3F4F5; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true,"section":"Motion"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.tries = 0; this.mount3d(); }
  componentDidUpdate() { if (!this.view) this.mount3d(); }
  componentWillUnmount() { clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'home', theme: 'night', shift: [0.08, 0.04], zoom: 0.84, still: this.props.motion === false });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    return { canvasRef: this.refFn };
  }
}
</script>
</body>
</html>
