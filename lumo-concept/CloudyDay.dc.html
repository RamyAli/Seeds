<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo Home – Cloudy day, battery offline</title>
<script src="./support.js"></script>
<script src="/_blob/b182923961479cc4ed198465a486c3a2"></script>
<script src="/_blob/089d29c6ab9b713f088013abcd18ba13"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#111315}a:hover{color:#5E6369}
canvas{display:block}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F3F5; color: #111315; font-family: 'Manrope', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 56px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; align-items: center; gap: 10px; height: 44px">
      <div style="display: flex; flex-direction: column; flex: 1; line-height: 1.2">
        <span style="font-size: 13px; color: #5E6369; font-weight: 500">Thursday, 16 July</span>
        <span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Hi, Omar</span>
      </div>
      <span style="height: 44px; padding: 0 14px; border-radius: 22px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5E6369" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H8a5 5 0 1 1 1-9.9A6 6 0 0 1 20.6 11 4 4 0 0 1 17.5 19z"></path></svg>36° Cloudy</span>
    </header>

    <section role="status" style="background: #FFFFFF; border-radius: 22px; padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 20px; background: #F2F3F5; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M2 2l20 20M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5.2-2.8M19 13a10 10 0 0 0-2.2-1.6M12 20h.01"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; flex: 1; line-height: 1.3">
        <span style="font-size: 14px; font-weight: 800">Battery offline since 1:52 pm</span>
        <span style="font-size: 12px; color: #5E6369; font-weight: 500">Home is fine on solar + grid. Retrying every 5 min.</span>
      </div>
      <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: #111315; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer; flex: none">Fix it</button>
    </section>

    <section aria-label="Live energy" style="position: relative; height: 300px; border-radius: 28px; background: #FFFFFF; overflow: hidden">
      <canvas ref="{{canvasRef}}" width="350" height="300" role="img" aria-label="3D view of your villa on a cloudy day. Clouds over the panels, solar is making 1.1 kW, the grid supplies 3.4 kW, the battery is offline and greyed out." style="position: absolute; left: 0; top: 0; width: 350px; height: 300px; touch-action: pan-y; cursor: grab"></canvas>
      <div style="position: absolute; left: 18px; top: 16px; display: flex; flex-direction: column; pointer-events: none">
        <span style="font-size: 13px; font-weight: 700">Right now</span>
        <span style="font-size: 64px; line-height: 1; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; margin-top: 4px">24<span style="font-size: 30px; letter-spacing: -0.02em">%</span></span>
        <span style="font-size: 13px; font-weight: 600; color: #5E6369">powered by the sun</span>
      </div>
      <span style="position: absolute; right: 14px; top: 16px; height: 28px; padding: 0 10px; border-radius: 14px; background: #F2F3F5; font-size: 11px; font-weight: 700; color: #5E6369; display: flex; align-items: center; pointer-events: none">Updated 8 sec ago</span>
      <div style="position: absolute; left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
        <a href="SolarDetail.dc.html" aria-label="Solar 1.1 kW, cloudy. Open solar details" style="background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid #EEF0F2; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; gap: 2px; text-decoration: none; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #FFA51F"></span>
          <b style="font-size: 15px; font-variant-numeric: tabular-nums">1.1</b>
          <span style="font-size: 10px; color: #5E6369; font-weight: 600">Solar kW</span>
        </a>
        <button aria-label="Battery offline, last seen at 64%" style="position: relative; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px dashed #9AA0A8; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; color: #111315; cursor: pointer; min-height: 58px">
          <span style="position: absolute; right: 6px; top: 6px; width: 16px; height: 16px; border-radius: 8px; background: #111315; color: #FFFFFF; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center">!</span>
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #B9BEC4"></span>
          <b style="font-size: 14px">Offline</b>
          <span style="font-size: 10px; color: #5E6369; font-weight: 600">Battery</span>
        </button>
        <button aria-label="Grid supplying 3.4 kW" style="background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid #EEF0F2; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; color: #111315; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #3D8BFF"></span>
          <b style="font-size: 15px; font-variant-numeric: tabular-nums">3.4</b>
          <span style="font-size: 10px; color: #5E6369; font-weight: 600">Grid kW</span>
        </button>
        <button aria-label="EV charger idle" style="background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px dashed #B9BEC4; border-radius: 16px; padding: 8px 8px 7px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; color: #111315; cursor: pointer; min-height: 58px">
          <span style="width: 16px; height: 4px; border-radius: 2px; background: #B9BEC4"></span>
          <b style="font-size: 15px">Idle</b>
          <span style="font-size: 10px; color: #5E6369; font-weight: 600">EV · 11 pm</span>
        </button>
      </div>
    </section>

    <section aria-label="Insight" style="background: #FFFFFF; border-radius: 26px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
      <span style="width: 44px; height: 44px; flex: none; border-radius: 22px; background: #E8F0FF; color: #1D5FD1; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      </span>
      <div style="display: flex; flex-direction: column; gap: 2px; line-height: 1.4">
        <span style="font-size: 14px; font-weight: 800">A cloudy one — nothing to do</span>
        <span style="font-size: 13px; color: #5E6369; font-weight: 500">We'll skip battery-based Grid moments today. Your streak is paused, not lost.</span>
      </div>
    </section>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 22px; height: 68px; border-radius: 34px; padding: 8px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(17,19,21,.10); display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-current="page" style="height: 52px; padding: 0 18px 0 14px; border-radius: 26px; background: #A6F23C; color: #111315; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 800">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
    <a href="SolarDetail.dc.html" aria-label="Usage" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M3 3v18h18"></path><path d="M7 15v3M12 10v8M17 6v12"></path></svg></a>
    <a href="Wallet.dc.html" aria-label="Rewards" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg></a>
    <a href="Main.dc.html" aria-label="Account" style="width: 52px; height: 52px; border-radius: 26px; background: #F2F3F5; color: #111315; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true,"section":"Motion"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.tries = 0; this.mount3d(); }
  componentDidUpdate() { if (!this.view) this.mount3d(); }
  componentWillUnmount() { clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'home', theme: 'cloudy', shift: [0.08, 0.06], zoom: 0.84, still: this.props.motion === false });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    return { canvasRef: this.refFn };
  }
}
</script>
</body>
</html>
