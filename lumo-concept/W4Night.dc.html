<script type="text/x-dc" data-dc-script data-props='{"motion":{"editor":"boolean","default":true,"section":"Motion"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { bat: true, grid: false, ev: true }; }
  componentDidMount() { this.tries = 0; this.mount3d(); }
  componentDidUpdate() { if (!this.view) this.mount3d(); }
  componentWillUnmount() { clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'home', arch: true, theme: 'warmNight', shift: [0.06, -0.19], zoom: 0.6, still: this.props.motion === false });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    const mk = (key) => {
      const on = !!this.state[key];
      return { on, track: on ? '#F2EFEA' : 'rgba(255,255,255,.18)', knobBg: on ? '#1D1D1D' : '#8A857E',
        knob: on ? 'translateX(26px)' : 'translateX(0)', flip: () => this.setState({ [key]: !on }) };
    };
    return { canvasRef: this.refFn, bat: mk('bat'), grid: mk('grid'), ev: mk('ev') };
  }
}
</script>
