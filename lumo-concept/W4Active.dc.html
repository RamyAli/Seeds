<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo v4 – Grid moment in progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#1D1D1D}a:hover{color:#5F5C57}
.seg:focus-visible{outline:2px solid #3F628F;outline-offset:2px}
@keyframes lumoPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.pulse{animation:lumoPulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E3E0DB; color: #1D1D1D; font-family: 'Geist', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 52px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <header style="display: flex; justify-content: space-between; align-items: center; height: 48px">
      <a href="W4Home.dc.html" aria-label="Minimise, the grid moment keeps running" style="width: 46px; height: 46px; border-radius: 23px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <span style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; font-size: 13px; display: flex; align-items: center; gap: 7px">
        <span class="pulse" style="width: 7px; height: 7px; border-radius: 4px; background: #E8692A"></span>Live · 5–7 PM</span>
    </header>
    <h1 style="margin: 6px 0 2px; font-size: 26px; font-weight: 400; letter-spacing: -0.01em">Grid Moment</h1>

    <section aria-label="Your devices" style="background: #F6F5F2; border-radius: 22px; padding: 4px 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #E7E4DF"><span style="font-size: 15px">AC holding 25°C</span><span style="font-size: 12px; color: #5F5C57">Inside 24.1°C</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid #E7E4DF"><span style="font-size: 15px">Battery running the house</span><span style="font-size: 12px; color: #5F5C57">71%</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 11px 0"><span style="font-size: 15px">EV charging paused</span><span style="font-size: 12px; color: #5F5C57">Resumes 7 PM</span></div>
    </section>
  </div>

  <section style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 476px; border-radius: 38px; background: #F4F2EE; padding: 26px 16px 18px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 -10px 40px rgba(0,0,0,.06)">
    <span style="font-size: 13px; color: #5F5C57">{{sheetLabel}}</span>
    <div role="radiogroup" aria-label="Show" style="display: flex; gap: 8px; margin-top: 12px">
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="2">
        <button class="seg" role="radio" aria-checked="{{s.on}}" onClick="{{s.pick}}" style="width: 96px; height: 42px; border-radius: 14px; border: {{s.border}}; background: {{s.bg}}; color: #1D1D1D; font-size: 14px; cursor: pointer">{{s.label}}</button>
      </sc-for>
    </div>
    <a href="W4Result.dc.html" aria-label="{{aria}}" style="display: flex; flex-direction: column; align-items: center; margin-top: 18px; text-decoration: none; color: #1D1D1D">
      <span aria-hidden="true" style="font-size: 34px; line-height: 1.2; font-weight: 300; color: #CFCBC5; font-variant-numeric: tabular-nums">{{prev}}</span>
      <span style="font-size: 72px; line-height: 1.05; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">{{main}}</span>
      <span aria-hidden="true" style="font-size: 34px; line-height: 1.2; font-weight: 300; color: #CFCBC5; font-variant-numeric: tabular-nums">{{next}}</span>
    </a>
    <span style="font-size: 13px; color: #5F5C57; margin-top: 10px">{{caption}}</span>
    <div style="margin-top: auto; align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 8px">
      <button style="width: 100%; height: 56px; border-radius: 28px; border: 0; background: #23211F; color: #FFFFFF; font-size: 15px; font-weight: 500; cursor: pointer">Stop early</button>
      <span style="font-size: 12px; color: #5F5C57">You keep the {{earned}} points earned so far.</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { left: 1 * 3600 + 24 * 60 + 36, view: 0 }; }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ left: this.state.left > 0 ? this.state.left - 1 : 7200 }), 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const total = 7200, left = this.state.left;
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const fmt = (x) => { x = Math.max(0, Math.min(total, x)); return Math.floor(x / 3600) + ':' + pad(Math.floor((x % 3600) / 60)) + ':' + pad(x % 60); };
    const earnedAt = (x) => Math.round(120 * (total - x) / total);
    const earned = earnedAt(left);
    const time = this.state.view === 0;
    const segs = ['Time', 'Points'].map((label, i) => ({
      label, on: this.state.view === i,
      bg: this.state.view === i ? '#FFFFFF' : 'transparent',
      border: this.state.view === i ? '0' : '1px solid #DAD6D0',
      pick: () => this.setState({ view: i })
    }));
    return {
      segs, earned,
      sheetLabel: time ? 'Time left' : 'Points so far',
      prev: time ? fmt(left + 1) : '+' + Math.max(0, earned - 1),
      main: time ? fmt(left) : '+' + earned,
      next: time ? fmt(left - 1) : '+' + Math.min(120, earned + 1),
      caption: time ? 'Ends at 7:00 PM · +' + earned + ' of 120 points' : 'of 120 · ≈ AED ' + (earned / 20).toFixed(2) + ' credit',
      aria: time ? 'Time left ' + fmt(left) + '. Open result preview' : earned + ' points so far. Open result preview'
    };
  }
}
</script>
</body>
</html>
