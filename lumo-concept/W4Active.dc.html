<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo v4 – Grid moment in progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#1E1C1A}a:hover{color:#6B665F}
@keyframes lumoPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.pulse{animation:lumoPulse 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E7E4DF; color: #1E1C1A; font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.4">
  <div style="padding: 52px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; justify-content: space-between; align-items: center; height: 48px">
      <a href="W4Home.dc.html" aria-label="Minimise, the grid moment keeps running" style="width: 48px; height: 48px; border-radius: 24px; background: #F6F4F1; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </a>
      <span style="height: 36px; padding: 0 14px; border-radius: 18px; background: #F6F4F1; font-size: 13px; display: flex; align-items: center; gap: 7px">
        <span class="pulse" style="width: 7px; height: 7px; border-radius: 4px; background: #EE7A3B"></span>Live · 5–7 pm</span>
    </header>
    <h1 style="margin: 0; font-size: 34px; font-weight: 300; letter-spacing: -0.03em">Grid moment</h1>

    <a href="W4Result.dc.html" aria-label="{{ringLabel}}" style="position: relative; height: 300px; display: flex; justify-content: center; text-decoration: none; color: #1E1C1A">
      <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true">
        <defs>
          <linearGradient id="actGrad" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#F8CFAE"></stop>
            <stop offset="1" stop-color="#EE7A3B"></stop>
          </linearGradient>
        </defs>
        <path d="{{ticksDone}}" stroke="url(#actGrad)" stroke-width="3" stroke-linecap="round" fill="none"></path>
        <path d="{{ticksLeft}}" stroke="#D3CEC7" stroke-width="2" stroke-linecap="round" fill="none"></path>
        <circle cx="{{dot.x}}" cy="{{dot.y}}" r="6" fill="#EE7A3B" stroke="#E7E4DF" stroke-width="3"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <span style="font-size: 13px; color: #4F4A44">Time left</span>
        <span style="font-size: 56px; line-height: 1.05; font-weight: 300; letter-spacing: -0.04em; font-variant-numeric: tabular-nums">{{clock}}</span>
        <span style="font-size: 13px; color: #4F4A44">ends at 7:00 pm</span>
      </div>
      <span style="position: absolute; left: 52px; bottom: 26px; font-size: 11px; color: #6B665F">5 pm</span>
      <span style="position: absolute; right: 52px; bottom: 26px; font-size: 11px; color: #6B665F">7 pm</span>
    </a>

    <section style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <div style="background: #DDF57A; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-size: 30px; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">+{{earned}}</span>
        <span style="font-size: 12px; color: #3E4421">points so far · of 120</span>
      </div>
      <div style="background: #F6F4F1; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-size: 30px; font-weight: 300; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">24.1°<span style="font-size: 14px">C</span></span>
        <span style="font-size: 12px; color: #4F4A44">inside · comfortable</span>
      </div>
    </section>

    <section aria-label="Your devices" style="background: #F6F4F1; border-radius: 26px; padding: 6px 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #E3DFD9"><span style="font-size: 14px">AC holding 25°C</span><span style="font-size: 12px; color: #4F4A44; display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>On track</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #E3DFD9"><span style="font-size: 14px">Battery running the house · 71%</span><span style="font-size: 12px; color: #4F4A44; display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>On track</span></div>
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0"><span style="font-size: 14px">EV paused till 7 pm</span><span style="font-size: 12px; color: #4F4A44; display: flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>On track</span></div>
    </section>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <button style="height: 56px; width: 100%; border-radius: 28px; border: 0; background: #F6F4F1; color: #1E1C1A; font-size: 16px; font-weight: 500; cursor: pointer">Stop early</button>
    <span style="font-size: 12px; color: #4F4A44">You keep the {{earned}} points earned so far.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { left: 1 * 3600 + 24 * 60 + 36 }; }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ left: this.state.left > 0 ? this.state.left - 1 : 7200 }), 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const total = 7200, left = this.state.left;
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const h = Math.floor(left / 3600), m = Math.floor((left % 3600) / 60), s = left % 60;
    const frac = (total - left) / total;
    const earned = Math.round(120 * frac);
    const N = 64, cx = 150, cy = 150, r1 = 112, r2 = 138, start = Math.PI * 1.25, sweep = Math.PI * 1.5;
    let done = '', rest = '';
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1), a = start - t * sweep;
      const seg = 'M' + (cx + Math.cos(a) * r1).toFixed(1) + ' ' + (cy - Math.sin(a) * r1).toFixed(1) + 'L' + (cx + Math.cos(a) * r2).toFixed(1) + ' ' + (cy - Math.sin(a) * r2).toFixed(1);
      if (t <= frac) done += seg; else rest += seg;
    }
    const ae = start - frac * sweep;
    return {
      clock: h + ':' + pad(m) + ':' + pad(s), earned, ticksDone: done || 'M0 0', ticksLeft: rest || 'M0 0',
      dot: { x: (cx + Math.cos(ae) * (r2 + 8)).toFixed(1), y: (cy - Math.sin(ae) * (r2 + 8)).toFixed(1) },
      ringLabel: 'Grid moment ends in ' + h + ' hours ' + m + ' minutes. ' + earned + ' points earned so far. Open result preview'
    };
  }
}
</script>
</body>
</html>
