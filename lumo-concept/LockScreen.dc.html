<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo – Grid moment push notification</title>
<script src="./support.js"></script>
<script src="/_blob/b182923961479cc4ed198465a486c3a2"></script>
<script src="/_blob/089d29c6ab9b713f088013abcd18ba13"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#111315}a:hover{color:#5E6369}
canvas{display:block}
@keyframes lumoDrop{0%{transform:translateY(-28px) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.drop{animation:lumoDrop .55s cubic-bezier(.2,.9,.3,1.2) both}
.drop2{animation:lumoDrop .55s .12s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion: reduce){.drop,.drop2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E9EBEE; color: #111315; font-family: 'Manrope', -apple-system, system-ui, sans-serif; line-height: 1.4">
  <canvas ref="{{canvasRef}}" width="390" height="844" role="img" aria-label="Lock screen wallpaper: a 3D model of your villa with solar on the roof." style="position: absolute; left: 0; top: 0; width: 390px; height: 844px"></canvas>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 70px; pointer-events: none">
    <span style="font-size: 17px; font-weight: 700; color: #3A3E44">Wednesday 15 July</span>
    <span style="font-size: 104px; line-height: 0.95; font-weight: 800; letter-spacing: -0.05em; font-variant-numeric: tabular-nums">3:42</span>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 300px; display: flex; flex-direction: column; gap: 8px">
    <a href="GridMoment.dc.html" class="drop" aria-label="Lumo notification: Grid moment 5 to 7 pm, earn 120 points. Open to review" style="display: flex; gap: 12px; padding: 14px; border-radius: 26px; background: rgba(255,255,255,0.94); backdrop-filter: blur(20px); box-shadow: 0 12px 30px rgba(17,19,21,.12); text-decoration: none; color: #111315">
      <span style="width: 42px; height: 42px; flex: none; border-radius: 12px; background: #111315; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="5" fill="#A6F23C"></circle><rect x="5" y="17" width="14" height="2.5" rx="1.25" fill="#FFFFFF"></rect></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <span style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 800"><span>Grid moment · 5–7 pm</span><span style="font-size: 12px; font-weight: 600; color: #5E6369">now</span></span>
        <span style="font-size: 14px; line-height: 1.4; color: #2A2D31; font-weight: 500">Earn <b style="font-weight: 800">120 points</b> tonight. Pre-cool now and pause the EV charge — one tap and Lumo handles it.</span>
      </span>
    </a>
    <div class="drop2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="GridMoment.dc.html" style="height: 52px; border-radius: 26px; background: #A6F23C; color: #111315; font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>Review &amp; accept</a>
      <button style="height: 52px; border-radius: 26px; border: 0; background: rgba(255,255,255,0.94); color: #111315; font-size: 15px; font-weight: 700; cursor: pointer">Not today</button>
    </div>
  </div>

  <div style="position: absolute; left: 44px; right: 44px; bottom: 40px; display: flex; justify-content: space-between">
    <button aria-label="Torch" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: rgba(255,255,255,0.85); color: #111315; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-1 6H9zM9 8h6v13a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1zM12 12v3"></path></svg>
    </button>
    <button aria-label="Camera" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: rgba(255,255,255,0.85); color: #111315; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() { this.tries = 0; this.mount3d(); }
  componentDidUpdate() { if (!this.view) this.mount3d(); }
  componentWillUnmount() { clearTimeout(this.retry); if (this.view) this.view.dispose(); }
  mount3d() {
    if (this.view || !this.canvas) return;
    if (!window.Lumo3D) {
      if (this.tries++ < 40) this.retry = setTimeout(() => this.mount3d(), 150);
      return;
    }
    this.view = window.Lumo3D.mount(this.canvas, { scene: 'home', theme: 'day', shift: [0, -0.24], zoom: 0.5 });
  }
  renderVals() {
    if (!this.refFn) this.refFn = (el) => { if (el) this.canvas = el; };
    return { canvasRef: this.refFn };
  }
}
</script>
</body>
</html>
