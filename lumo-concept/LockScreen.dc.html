<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumo – Grid moment push notification</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#15171A}a:hover{color:#3D4249}
@keyframes lumoDrop{0%{transform:translateY(-24px) scale(.96);opacity:0}100%{transform:none;opacity:1}}
.drop{animation:lumoDrop .5s cubic-bezier(.2,.9,.3,1.2) both}
.drop2{animation:lumoDrop .5s .12s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion: reduce){.drop,.drop2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1A2130; color: #FFFFFF; font-family: 'Readex Pro', system-ui, sans-serif; line-height: 1.4">
  <svg width="390" height="844" viewBox="0 0 390 844" style="position: absolute; inset: 0" aria-hidden="true">
    <rect width="390" height="844" fill="#1A2130"></rect>
    <rect y="420" width="390" height="424" fill="#222838"></rect>
    <circle cx="270" cy="560" r="64" fill="#E8772E" fill-opacity="0.85"></circle>
    <path d="M0 600 C 90 560 170 570 250 600 S 360 640 390 620 V 844 H 0 Z" fill="#3A2F2E"></path>
    <path d="M0 680 C 120 640 200 650 300 690 S 380 700 390 690 V 844 H 0 Z" fill="#2B2526"></path>
    <path d="M0 760 C 100 730 220 740 390 770 V 844 H 0 Z" fill="#1E1B1D"></path>
  </svg>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 72px">
    <span style="font-size: 17px; font-weight: 500; opacity: 0.9">Wednesday 15 July</span>
    <span style="font-size: 92px; line-height: 1; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums">3:42</span>
  </div>

  <div style="position: absolute; left: 12px; right: 12px; top: 330px; display: flex; flex-direction: column; gap: 8px">
    <a href="GridMoment.dc.html" class="drop" aria-label="Lumo notification: Grid moment 5 to 7 pm, earn 120 points. Open to review" style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 24px; background: rgba(246,245,241,0.9); backdrop-filter: blur(24px); color: #15171A; text-decoration: none">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 22px; height: 22px; border-radius: 6px; background: #15171A; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="5" fill="#F5A524"></circle><rect x="5" y="17" width="14" height="2.5" rx="1.25" fill="#3B82F6"></rect></svg>
        </span>
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em">LUMO</span>
        <span style="font-size: 13px; color: #5B616A; margin-left: auto">now</span>
      </div>
      <span style="font-size: 16px; font-weight: 600; line-height: 1.3">Grid moment, 5–7 pm · earn 120 points</span>
      <span style="font-size: 14px; line-height: 1.4; color: #3D4249">The grid's busy this evening. Pre-cool now and pause the EV charge — one tap and we'll handle it.</span>
    </a>
    <div class="drop2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="GridMoment.dc.html" style="height: 52px; border-radius: 18px; background: #F5A524; color: #15171A; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>Review &amp; accept</a>
      <button style="height: 52px; border-radius: 18px; border: 0; background: rgba(246,245,241,0.9); color: #15171A; font-size: 15px; font-weight: 500; cursor: pointer">Not today</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-radius: 22px; background: rgba(246,245,241,0.72); backdrop-filter: blur(24px); color: #15171A; margin-top: 6px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="width: 22px; height: 22px; border-radius: 6px; background: #15171A; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="5" fill="#F5A524"></circle><rect x="5" y="17" width="14" height="2.5" rx="1.25" fill="#3B82F6"></rect></svg>
        </span>
        <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.04em">LUMO</span>
        <span style="font-size: 13px; color: #3D4249; margin-left: auto">8:02 am</span>
      </div>
      <span style="font-size: 14px; line-height: 1.4">Yesterday the sun covered 71% of your home. You saved AED 7.10.</span>
    </div>
  </div>

  <span style="position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-size: 13px; opacity: 0.85">Swipe up to open</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {};
  }

</html>
