<!doctype html>

<head>

<title>Lumo – Grid moment push notification</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button,a{font-family:inherit}
a{color:#FFFFFF}a:hover{color:#FFE2B8}
.glass-d{background:rgba(28,28,38,.42);-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);border:1px solid rgba(255,255,255,.18);box-shadow:0 14px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.22)}
.glass-l{background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
@keyframes lumoDrop{0%{transform:translateY(-28px) scale(.94);opacity:0}100%{transform:none;opacity:1}}
.drop{animation:lumoDrop .55s cubic-bezier(.2,.9,.3,1.2) both}
.drop2{animation:lumoDrop .55s .12s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion: reduce){.drop,.drop2{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #1E2347; color: #FFFFFF; font-family: 'Figtree', -apple-system, system-ui, sans-serif; line-height: 1.4">

        <stop offset="0" stop-color="#1E2347"></stop>

        <stop offset="1" stop-color="#FFC48A"></stop>

    <path d="M0 610 C 90 570 170 580 250 610 S 360 650 390 630 V 844 H 0 Z" fill="#B9603F"></path>
    <path d="M0 690 C 120 650 200 660 300 700 S 380 710 390 700 V 844 H 0 Z" fill="#8A4632"></path>
    <path d="M0 770 C 100 740 220 750 390 780 V 844 H 0 Z" fill="#5E2F26"></path>

  </div>

  <div style="position: absolute; left: 10px; right: 10px; top: 330px; display: flex; flex-direction: column; gap: 8px">
    <a href="GridMoment.dc.html" class="drop glass-d" aria-label="Lumo notification: Grid moment 5 to 7 pm, earn 120 points. Open to review" style="display: flex; gap: 12px; padding: 14px; border-radius: 28px; text-decoration: none; color: #FFFFFF">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 11px; background: #1D1D1F; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,.2)">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="5" fill="#FF9500"></circle><rect x="5" y="17" width="14" height="2.5" rx="1.25" fill="#0A84FF"></rect></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 2px; flex: 1">
        <span style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 700"><span>Grid moment · 5–7 pm</span><span style="font-size: 13px; font-weight: 500; opacity: 0.75">now</span></span>
        <span style="font-size: 15px; line-height: 1.35; opacity: 0.95">Earn 120 points tonight. Pre-cool now and pause the EV charge — one tap and Lumo handles it.</span>
      </span>
    </a>
    <div class="drop2" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <a href="GridMoment.dc.html" style="height: 52px; border-radius: 26px; background: #FF9F0A; color: #1D1D1F; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; box-shadow: 0 8px 20px rgba(255,149,0,.35), inset 0 1px 0 rgba(255,255,255,.5)">

      <button class="glass-d" style="height: 52px; border-radius: 26px; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer">Not today</button>
    </div>

    <div class="glass-d" style="display: flex; gap: 12px; padding: 12px 14px; border-radius: 26px; margin-top: 8px; opacity: 0.92">
      <span style="width: 40px; height: 40px; flex: none; border-radius: 11px; background: #1D1D1F; display: flex; align-items: center; justify-content: center">
        <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="5" fill="#FF9500"></circle><rect x="5" y="17" width="14" height="2.5" rx="1.25" fill="#0A84FF"></rect></svg>
      </span>
      <span style="display: flex; flex-direction: column; flex: 1">
        <span style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 700"><span>Yesterday</span><span style="font-size: 13px; font-weight: 500; opacity: 0.75">8:02 am</span></span>
        <span style="font-size: 14px; line-height: 1.35">The sun covered 71% of your home. You saved AED 7.10.</span>
      </span>
    </div>
  </div>

  <div style="position: absolute; left: 44px; right: 44px; bottom: 44px; display: flex; justify-content: space-between">
    <button class="glass-l" aria-label="Torch" style="width: 52px; height: 52px; border-radius: 26px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8l-1 6H9zM9 8h6v13a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1zM12 12v3"></path></svg>
    </button>
    <button class="glass-l" aria-label="Camera" style="width: 52px; height: 52px; border-radius: 26px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13" r="4"></circle></svg>
    </button>
  </div>
</div>
</x-dc>
